[package]
name = "infinity-provider-openrouter"
publish = true
version = "0.2.0"
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"
description = "OpenRouter model provider and shared chat adapter for Infinity agents."

[dependencies]
infinity-provider-protocol = { path = "../infinity-provider-protocol", version = "^0.2.0", features = ["remote"] }
async-trait = { workspace = true }
async-stream = "0.3"
futures-util = { workspace = true }
reqwest = { workspace = true }
eventsource-stream = "0.2"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
